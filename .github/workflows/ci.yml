name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push makes an in-flight run for the same ref pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job on purpose. Every check needs the same installed dependency tree,
  # and splitting them would mean installing it several times to save nothing:
  # the whole run is well under a minute.
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        # Integration tests run against a real Redis. Mocking it would only
        # assert that the mock behaves as assumed, since the behaviour under
        # test (backoff, deduplication TTLs, delayed-set promotion) lives in
        # BullMQ's Lua scripts.
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The port the service container is published on, which differs from the
      # local default in tests/helpers/redis.ts.
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v7

      # Before actions/setup-node, so the pnpm cache directory exists for it to
      # key against. The version comes from `packageManager` in package.json.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # `--frozen-lockfile` fails the build if package.json and the lockfile
        # disagree, rather than quietly resolving something new.
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          # Built and discarded: this job proves the Dockerfile still works,
          # and publishing is a release concern, not a CI one.
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
